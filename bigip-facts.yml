---
- name: GRAB F5 FACTS
  hosts: bigip
  connection: local
  gather_facts: no
  vars_files:
    - vars_encrypted.yml

  tasks:

    - name: COLLECT BIG-IP FACTS
      bigip_device_info:
        gather_subset:
         - system-info
        provider:
          server: "{{ansible_host}}"
          user: "{{ansible_user}}"
          password: "{{bigip_pass}}"
          server_port: 8443
          validate_certs: no
      register: device_facts

    - name: DISPLAY COMPLETE BIG-IP SYSTEM INFORMATION
      debug:
        var: device_facts
